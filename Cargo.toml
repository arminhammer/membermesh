[workspace]
members = [
    "crates/membermesh-core",
    "crates/membermesh",
    "crates/membermesh-testkit",
    "crates/membermesh-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arminhammer/membermesh"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panic & safety prevention (exempt test modules/harnesses explicitly)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"

# Match & API ergonomics
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"

# Performance & redundancy
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytes = { version = "1.10", features = ["serde"] }
cucumber = "0.23"
ed25519-dalek = "3.0"
iroh-gossip = "0.103"
membermesh = { path = "crates/membermesh", version = "0.1.0" }
membermesh-core = { path = "crates/membermesh-core", version = "0.1.0" }
membermesh-testkit = { path = "crates/membermesh-testkit", version = "0.1.0" }
n0-future = "0.3"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
proptest = "1.12"
rand = { version = "0.10", features = ["chacha"] }
serde = { version = "1.0", features = ["derive"] }
stateright = "0.31"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
