min_version = "2024.11.0"

[tools]
rust = { version = "1.100.0", components = ["clippy", "rustfmt"] }

[tasks.fmt]
description = "Check formatting across the workspace"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Check all targets across the workspace"
run = "cargo check --workspace --all-targets --all-features --locked"

[tasks.lint]
description = "Run Clippy pedantic and panic-free lints"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run unit, BDD, and doc tests (offline)"
run = "cargo test --workspace --locked"

[tasks.test-slow]
description = "Run full test suite including @slow soak scenarios"
env = { BDD_SLOW = "1" }
run = "cargo test --workspace --locked"

[tasks.doc]
description = "Build documentation with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --locked"

[tasks.deny]
description = "Check dependency licenses, bans, and sources"
run = "cargo deny --all-features --offline check licenses bans sources"

[tasks.audit]
description = "Run security advisory audit"
run = "cargo audit"

[tasks.ci]
description = "Run full local CI gate"
depends = ["fmt", "lint", "test", "doc", "deny"]
